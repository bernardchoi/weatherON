name: Source checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-checks.yml"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/source-checks.yml"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck mobile app
        run: npx tsc -p apps/mobile/tsconfig.json --noEmit
      - name: Check Android product quality
        run: npm run check:android-product-quality
      - name: Check core regressions
        run: |
          node scripts/check-ios-reliability.mjs
          node scripts/check-correctness-batch.mjs
          node scripts/check-weather-outfit-regressions.mjs
          node scripts/check-review-regressions.mjs
      - name: Check localization
        run: npm run check:mobile-localization
