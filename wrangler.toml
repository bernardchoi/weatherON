name = "weatheron-api"
main = "apps/server/src/worker.mjs"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[vars]
WEATHER_TIMEOUT_MS = "8000"
WEATHER_CACHE_TTL_MS = "600000"
PLACE_CACHE_TTL_MS = "1800000"
ROUTE_CACHE_TTL_MS = "600000"
APPLE_CLIENT_IDS = "com.weatheron.mobile,com.weatheron.mobile.dev"
WEATHERON_TERMS_VERSION = "2026-08-08"
APPLE_TEAM_IDENTIFIER = "R4L3X54675"
APP_ATTEST_BUNDLE_IDS = "com.weatheron.mobile,com.weatheron.mobile.dev"
APP_ATTEST_ALLOW_DEVELOPMENT = "false"
APP_INTEGRITY_MODE = "monitor"
APP_INTEGRITY_CHALLENGE_TTL_SECONDS = "120"
OAUTH_CALLBACK_URL = "https://weatheron-api.weatheron.workers.dev/auth/oauth/callback"
OAUTH_REDIRECT_URIS = "weatheron://oauth/callback"

[[d1_databases]]
binding = "WEATHERON_DB"
database_name = "weatheron-users"
database_id = "36a2678b-a29d-4245-8cd9-2c997806712f"
migrations_dir = "apps/server/migrations"
